services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tg-backend
    init: true
    restart: always
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      TELEGRAM_RECEIVER_MODE: ${TELEGRAM_RECEIVER_MODE:-polling}
      CONTROL_BOT_ENABLED: ${CONTROL_BOT_ENABLED:-true}
      CONTROL_BOT_TOKEN: ${CONTROL_BOT_TOKEN:-}
      CONTROL_CHAT_ID: ${CONTROL_CHAT_ID:-}
      CONTROL_ADMIN_IDS: ${CONTROL_ADMIN_IDS:-}
      CONTROL_COMMANDS_ENABLED: ${CONTROL_COMMANDS_ENABLED:-true}
      CONTROL_ALERTS_ENABLED: ${CONTROL_ALERTS_ENABLED:-true}
      CONTROL_ALERT_THREAD_ID: ${CONTROL_ALERT_THREAD_ID:-}
      CONTROL_COMMAND_THREAD_ID: ${CONTROL_COMMAND_THREAD_ID:-}
      CONTROL_POLLING_TIMEOUT: ${CONTROL_POLLING_TIMEOUT:-30}
      CONTROL_NOTIFY_LEVEL: ${CONTROL_NOTIFY_LEVEL:-error}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/backend/data
      - ./logs:/app/backend/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 5); connection.close()"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: tg-admin
    init: true
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
